<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Group Expense Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    /* Screenshot-style background */
    background:
        linear-gradient(
            to bottom,
            #b9e9f5 0%,
            #6cb9df 18%,
            #1975ca 42%,
            #06356f 58%,
            #06111f 76%,
            #000000 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    overflow: hidden;

    position: relative;

}


/* =========================================================
   BACKGROUND DECORATIONS
========================================================= */

body::before {

    content: "";

    position: absolute;

    width: 150px;
    height: 240px;

    top: -110px;
    right: 35px;

    border-radius: 80px;

    background:
        linear-gradient(
            135deg,
            rgba(188, 203, 255, 0.75),
            rgba(79, 105, 230, 0.35)
        );

    transform: rotate(-30deg);

    filter: blur(1px);

    opacity: 0.85;

}


body::after {

    content: "";

    position: absolute;

    width: 125px;
    height: 190px;

    bottom: -105px;
    left: -65px;

    border-radius: 70px;

    border:
        25px solid
        rgba(130, 190, 255, 0.75);

    transform: rotate(-25deg);

    filter: blur(1px);

}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-container {

    position: relative;

    z-index: 10;

    width: 100%;

    max-width: 326px;

    padding:
        18px 28px 22px;

    border-radius: 38px;

    /* GLASS */
    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.25),
            rgba(255, 255, 255, 0.06)
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.48);

    box-shadow:

        0 25px 60px
        rgba(0, 0, 0, 0.35),

        inset 0 1px 1px
        rgba(255, 255, 255, 0.25);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    animation:
        login-float 5s ease-in-out infinite;

}


/* =========================================================
   FLOATING ANIMATION
========================================================= */

@keyframes login-float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}


/* =========================================================
   BRAND
========================================================= */

.brand {

    text-align: center;

    margin-bottom: 18px;

}


/* =========================================================
   PAW ICON
========================================================= */

.brand-icon {

    width: 69px;

    height: 59px;

    margin:
        0 auto 7px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        #147be8;

    border-radius: 6px;

    font-size: 29px;

    box-shadow:
        0 7px 18px
        rgba(0, 0, 0, 0.18);

}


/* =========================================================
   TITLE
========================================================= */

.brand h1 {

    margin: 0;

    color: #ffffff;

    font-size: 25px;

    line-height: 1.05;

    font-weight: 700;

    letter-spacing: -1px;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.20);

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    margin-top: 6px;

    color:
        rgba(255, 255, 255, 0.90);

    font-family:
        "Courier New",
        monospace;

    font-size: 13px;

    font-weight: 600;

}


/* =========================================================
   FORM
========================================================= */

.form-group {

    margin-bottom: 15px;

}


/* =========================================================
   LABEL
========================================================= */

label {

    display: block;

    margin:
        0 0 6px 2px;

    color:
        rgba(255, 255, 255, 0.95);

    font-size: 12px;

    font-weight: 500;

}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    height: 33px;

    padding:
        0 12px;

    border: none;

    border-radius: 7px;

    background:
        rgba(255, 255, 255, 0.95);

    color:
        #172033;

    font-size: 13px;

    outline: none;

    box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);

    transition:
        box-shadow 0.2s,
        background 0.2s;

}


input:focus {

    background:
        #ffffff;

    box-shadow:

        0 0 0 2px
        rgba(255, 255, 255, 0.55),

        0 4px 12px
        rgba(0, 0, 0, 0.12);

}


input::placeholder {

    color:
        #8a94a6;

}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {

    width: 95px;

    height: 33px;

    margin-top: 5px;

    border: none;

    border-radius: 7px;

    background:
        #0878ed;

    color: #ffffff;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 5px 12px
        rgba(0, 75, 180, 0.30);

    transition:
        transform 0.15s,
        background 0.15s,
        box-shadow 0.15s;

}


.login-button:hover {

    background:
        #1685f5;

    box-shadow:
        0 7px 16px
        rgba(0, 75, 180, 0.35);

}


.login-button:active {

    transform:
        translateY(1px);

}


/* =========================================================
   MESSAGE
========================================================= */

#message {

    min-height: 17px;

    margin-top: 8px;

    color:
        #ffd1d1;

    font-size: 11px;

    line-height: 1.3;

}


/* =========================================================
   SIGN UP
========================================================= */

.signup-link {

    margin-top: 10px;

    padding-top: 12px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.18);

    text-align: center;

    color:
        rgba(255, 255, 255, 0.72);

    font-size: 11px;

}


.signup-link a {

    color:
        #ffffff;

    font-weight: 600;

    text-decoration: none;

}


.signup-link a:hover {

    text-decoration: underline;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    body {

        padding: 15px;

    }


    .login-container {

        max-width: 326px;

        padding:
            18px 25px 22px;

    }


    .brand h1 {

        font-size: 23px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .login-container {

        animation: none;

    }

}


    </style>

</head>


<body>


    <div class="login-container">


        <!-- =================================================
             BRAND
        ================================================= -->

        <div class="brand">

            <div class="brand-icon">
                🐾
            </div>

            <h1>
                Group Expense Tracker
            </h1>

            <div class="subtitle">
                Manage shared expenses with ease
            </div>

        </div>


        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- =================================================
             MESSAGE
        ================================================= -->

        <div id="message"></div>


        <!-- =================================================
             SIGN UP
        ================================================= -->

        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Create an account
            </a>

        </div>


    </div>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
    window.supabase.createClient(

        "https://fqsigukfusoplfzvevlz.supabase.co",

        "sb_publishable_S_o8arC97cbzU9F_pUIDOw_7FW-Y_Rz"

    );


/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document
                    .getElementById("message");


            message.textContent =
                "Logging in...";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (error) {

                console.error(
                    "Login failed:",
                    error
                );


                message.textContent =
                    error.message;

                return;

            }


            console.log(
                "Login successful:",
                data.user
            );


            window.location.replace(
                "dashboard.html"
            );

        }
    );

</script>


</body>

</html>
