<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Group Expense Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


    body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #000428;  /* fallback for old browsers */
background: -webkit-linear-gradient(to right, #000428, #041162 );  /* Chrome 10-25, Safari 5.1-6 */
background: linear-gradient(to right, #000428, #041162); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */


            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */

       /* =====================================================
   GLASSMORPHISM LOGIN CARD
   ===================================================== */
.login-container {
       width: 100%;
    max-width: 420px;

    background: #fffdf5;

    padding: 40px;

    border-radius: 18px;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.25);

    /* Floating effect */
    animation: login-float 5s ease-in-out infinite;
}


@keyframes login-float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}






/* =====================================================
   SUBTLE FLOATING EFFECT
   ===================================================== */

@keyframes card-float {

    0%,
    100% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-7px);
    }

}


/* =====================================================
   BRAND
   ===================================================== */

.brand h1 {

    color: #ffffff;

    text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.25);

}


.subtitle {

    color: rgba(255, 255, 255, 0.75);

}


/* =====================================================
   LABELS
   ===================================================== */

label {

    color: rgba(255, 255, 255, 0.90);

}


/* =====================================================
   INPUTS
   ===================================================== */

input {
    width: 100%;
    height: 48px;

    padding: 0 14px;

    border: 1px solid rgba(255, 255, 255, 0.35);

    border-radius: 9px;

    background: rgba(0, 0, 0, 0.18);

    color: #ffffff;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
}

input:focus {
    background: rgba(0, 0, 0, 0.25);

    border-color: rgba(255, 255, 255, 0.75);

    box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.15);
}

input::placeholder {
    color: rgba(255, 255, 255, 0.65);
}


/* =====================================================
   SIGN UP
   ===================================================== */

.signup-link {

    color:
        rgba(255, 255, 255, 0.70);

    border-top:
        1px solid
        rgba(255, 255, 255, 0.18);

}


.signup-link a {

    color: #ffffff;

}


/* =====================================================
   LOGIN BUTTON
   ===================================================== */

.login-button {

    background:
        rgba(255, 255, 255, 0.20);

    border:
        1px solid
        rgba(255, 255, 255, 0.30);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 8px 20px
        rgba(0, 0, 0, 0.20);

}


.login-button:hover {

    background:
        rgba(255, 255, 255, 0.30);

    box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.30);

}


/* =====================================================
   BRAND ICON
   ===================================================== */

  
    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      background: var(--navy);
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 27px;
      transform: rotate(-5deg);
      box-shadow: 0 8px 20px rgba(4, 17, 98, 0.2);
    }


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    .login-container {
        animation: none;
    }

}



        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            text-align: center;

            margin-bottom: 30px;

        }


        .brand-icon {

            width: 64px;

            height: 64px;

            margin: 0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f13fbc;

            border-radius: 16px;

            font-size: 30px;

            box-shadow:
                0 8px 20px
                rgba(15, 23, 42, 0.25);

        }


        .brand h1 {

            margin: 0;

            color: #0f172a;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: -0.4px;

        }


        .subtitle {

            margin-top: 8px;

            color: #64748b;

            font-size: 14px;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;

        }


        input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            background: #f8fafc;

            color: #0f172a;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;

        }


        input:focus {

            background: #ffffff;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);

        }


        input::placeholder {

            color: #94a3b8;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */
.login-button {
    width: 100%;
    height: 48px;
    margin-top: 5px;

    border: none;
    border-radius: 9px;

    background: #2563eb;

    color: white;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.15s,
        opacity 0.15s,
        box-shadow 0.15s;

    box-shadow:
        0 5px 12px
        rgba(37, 99, 235, 0.25);
}


.login-button:hover {
    background: #2563eb;
    opacity: 0.94;

    box-shadow:
        0 7px 16px
        rgba(37, 99, 235, 0.30);
}


.login-button:active {
    transform: translateY(1px);
}


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message {

            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            color: #dc2626;

            font-size: 14px;

            line-height: 1.4;

        }


        /* =====================================================
           SIGN UP
        ===================================================== */

        .signup-link {

            margin-top: 24px;

            padding-top: 22px;

            border-top:
                1px solid #e2e8f0;

            text-align: center;

            color: #64748b;

            font-size: 14px;

        }


        .signup-link a {

            color: #2563eb;

            font-weight: 600;

            text-decoration: none;

        }


        .signup-link a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .login-container {

                padding: 30px 24px;

                border-radius: 15px;

            }


            .brand h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- =================================================
             BRAND
        ================================================= -->

        <div class="brand">

            <div class="brand-icon">
                🐾
            </div>

            <h1>
                Group Expense Tracker
            </h1>

            <div class="subtitle">
                Manage shared expenses with ease
            </div>

        </div>


        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- =================================================
             MESSAGE
        ================================================= -->

        <div id="message"></div>


        <!-- =================================================
             SIGN UP
        ================================================= -->

        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Create an account
            </a>

        </div>


    </div>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
    window.supabase.createClient(

        "https://fqsigukfusoplfzvevlz.supabase.co",

        "sb_publishable_S_o8arC97cbzU9F_pUIDOw_7FW-Y_Rz"

    );


/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document
                    .getElementById("message");


            message.textContent =
                "Logging in...";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (error) {

                console.error(
                    "Login failed:",
                    error
                );


                message.textContent =
                    error.message;

                return;

            }


            console.log(
                "Login successful:",
                data.user
            );


            window.location.replace(
                "expensesss.html"
            );

        }
    );

</script>


</body>

</html>
