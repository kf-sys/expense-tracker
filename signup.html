<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#79c9e8">

    <title>Sign Up - Group Expense Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        /* =====================================================
           BODY / BACKGROUND
           SAME AS LOGIN PAGE
        ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    to bottom,
                    #b9e9f5 0%,
                    #6cb9df 18%,
                    #1975ca 42%,
                    #06356f 58%,
                    #06111f 76%,
                    #000000 100%
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow: hidden;

            position: relative;

        }


        /* =====================================================
           BACKGROUND DECORATIONS
           SAME STYLE AS LOGIN
        ===================================================== */

        body::before {

            content: "";

            position: absolute;

            width: 150px;
            height: 240px;

            top: -110px;
            right: 35px;

            border-radius: 80px;

            background:
                linear-gradient(
                    135deg,
                    rgba(188, 203, 255, 0.75),
                    rgba(79, 105, 230, 0.35)
                );

            transform:
                rotate(-30deg);

            filter: blur(1px);

            opacity: 0.85;

        }


        body::after {

            content: "";

            position: absolute;

            width: 125px;
            height: 190px;

            bottom: -105px;
            left: -65px;

            border-radius: 70px;

            border:
                25px solid
                rgba(130, 190, 255, 0.75);

            transform:
                rotate(-25deg);

            filter: blur(1px);

        }


        /* =====================================================
           EXTRA BACKGROUND SHAPES
        ===================================================== */

        .background-shape {

            position: absolute;

            pointer-events: none;

            z-index: 0;

        }


        .shape-top {

            width: 100px;
            height: 230px;

            top: -105px;
            right: 55px;

            border-radius: 70px;

            background:
                linear-gradient(
                    135deg,
                    rgba(178, 196, 255, 0.65),
                    rgba(71, 100, 224, 0.35)
                );

            transform:
                rotate(-28deg);

            filter: blur(1px);

        }


        .shape-bottom {

            width: 90px;
            height: 160px;

            bottom: -80px;
            left: -45px;

            border-radius: 50px;

            background:
                rgba(105, 173, 255, 0.65);

            transform:
                rotate(-20deg);

            filter: blur(1px);

        }


        /* =====================================================
           SIGN UP CARD
        ===================================================== */

        .signup-container {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 326px;

            padding:
                18px 28px 22px;

            border-radius: 38px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.25),
                    rgba(255, 255, 255, 0.06)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.48);

            box-shadow:

                0 25px 60px
                rgba(0, 0, 0, 0.35),

                inset 0 1px 1px
                rgba(255, 255, 255, 0.25);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            animation:
                signup-float 5s ease-in-out infinite;

        }


        /* =====================================================
           FLOATING ANIMATION
        ===================================================== */

        @keyframes signup-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            text-align: center;

            margin-bottom: 18px;

        }


        /* =====================================================
           BRAND ICON
        ===================================================== */

        .brand-icon {

            width: 69px;

            height: 59px;

            margin:
                0 auto 7px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #147be8;

            border-radius: 6px;

            font-size: 29px;

            box-shadow:
                0 7px 18px
                rgba(0, 0, 0, 0.18);

        }


        /* =====================================================
           TITLE
        ===================================================== */

        .brand h1 {

            margin: 0;

            color: #ffffff;

            font-size: 25px;

            line-height: 1.05;

            font-weight: 700;

            letter-spacing: -1px;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.20);

        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .subtitle {

            margin-top: 6px;

            color:
                rgba(255, 255, 255, 0.90);

            font-family:
                "Courier New",
                monospace;

            font-size: 13px;

            font-weight: 600;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 12px;

        }


        /* =====================================================
           LABEL
        ===================================================== */

        label {

            display: block;

            margin:
                0 0 6px 2px;

            color:
                rgba(255, 255, 255, 0.95);

            font-size: 12px;

            font-weight: 500;

        }


        /* =====================================================
           INPUT
        ===================================================== */

        input {

            width: 100%;

            height: 33px;

            padding:
                0 12px;

            border: none;

            border-radius: 7px;

            background:
                rgba(255, 255, 255, 0.95);

            color:
                #172033;

            font-size: 13px;

            outline: none;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);

            transition:
                box-shadow 0.2s,
                background 0.2s;

        }


        input:focus {

            background:
                #ffffff;

            box-shadow:

                0 0 0 2px
                rgba(255, 255, 255, 0.55),

                0 4px 12px
                rgba(0, 0, 0, 0.12);

        }


        input::placeholder {

            color:
                #8a94a6;

        }


        /* =====================================================
           CREATE ACCOUNT BUTTON
        ===================================================== */

        button {

            width: 100%;

            height: 33px;

            margin-top: 5px;

            border: none;

            border-radius: 7px;

            background:
                #0878ed;

            color: #ffffff;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 5px 12px
                rgba(0, 75, 180, 0.30);

            transition:
                transform 0.15s,
                background 0.15s,
                box-shadow 0.15s;

        }


        button:hover {

            background:
                #1685f5;

            box-shadow:
                0 7px 16px
                rgba(0, 75, 180, 0.35);

        }


        button:active {

            transform:
                translateY(1px);

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message {

            min-height: 17px;

            margin-top: 8px;

            text-align: center;

            font-size: 11px;

            line-height: 1.4;

            font-weight: 500;

        }


        /* =====================================================
           MESSAGE STATES
        ===================================================== */

        /* Error */

        #message.error {

            color:
                #ffb4b4;

        }


        /* Success */

        #message.success {

            color:
                #9ff3cf;

            text-shadow:
                0 1px 5px
                rgba(0, 0, 0, 0.15);

        }


        /* Loading */

        #message.loading {

            color:
                rgba(255, 255, 255, 0.90);

        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .login-link {

            margin-top: 10px;

            padding-top: 12px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.18);

            text-align: center;

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 11px;

        }


        .login-link a {

            color:
                #ffffff;

            font-weight: 600;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .signup-container {

                max-width: 326px;

                padding:
                    18px 25px 22px;

            }


            .brand h1 {

                font-size: 23px;

            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            .signup-container {

                animation: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND DECORATIONS
    ====================================================== -->

    <div class="background-shape shape-top"></div>

    <div class="background-shape shape-bottom"></div>


    <!-- =====================================================
         SIGN UP CARD
    ====================================================== -->

    <div class="signup-container">


        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="brand">

            <div class="brand-icon">
                🐾
            </div>


            <h1>
                Group Expense Tracker
            </h1>


            <div class="subtitle">
                Create your account
            </div>

        </div>


        <!-- =================================================
             SIGN UP FORM
        ================================================== -->

        <form id="signupForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your name"
                    required
                    autocomplete="name"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
            >
                CREATE ACCOUNT
            </button>


        </form>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div id="message"></div>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </div>


    <script>


        /* =====================================================
           SUPABASE
        ===================================================== */
const supabaseClient =
    window.supabase.createClient(

        "https://fqsigukfusoplfzvevlz.supabase.co",

        "sb_publishable_S_o8arC97cbzU9F_pUIDOw_7FW-Y_Rz"

    );


        /* =====================================================
           SIGN UP
        ===================================================== */

        document
            .getElementById("signupForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    /* -----------------------------------------
                       GET FORM VALUES
                    ----------------------------------------- */

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    /* -----------------------------------------
                       CLEAR MESSAGE CLASSES
                    ----------------------------------------- */

                    message.className = "";


                    /* -----------------------------------------
                       CHECK PASSWORDS
                    ----------------------------------------- */

                    if (
                        password !==
                        confirmPassword
                    ) {

                        message.className =
                            "error";

                        message.textContent =
                            "Passwords do not match.";

                        return;

                    }


                    /* -----------------------------------------
                       LOADING MESSAGE
                    ----------------------------------------- */

                    message.className =
                        "loading";

                    message.textContent =
                        "Creating account...";


                    /* -----------------------------------------
                       CREATE SUPABASE ACCOUNT
                    ----------------------------------------- */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signUp({

                            email:
                                email,

                            password:
                                password,

                            options: {

                                data: {

                                    display_name:
                                        name

                                }

                            }

                        });


                    /* -----------------------------------------
                       ERROR
                    ----------------------------------------- */

                    if (error) {

                        console.error(
                            "Signup failed:",
                            error
                        );


                        message.className =
                            "error";

                        message.textContent =
                            error.message;

                        return;

                    }


                    /* -----------------------------------------
                       ACCOUNT CREATED
                    ----------------------------------------- */

                    console.log(
                        "Account created:",
                        data
                    );


                    /* -----------------------------------------
                       USER IS ALREADY LOGGED IN
                    ----------------------------------------- */

                    if (data.session) {

                        message.className =
                            "success";

                        message.textContent =
                            "Account created successfully!";


                        setTimeout(
                            function() {

                                window.location.replace(
                                    "expensesss.html"
                                );

                            },
                            1000
                        );

                    }


                    /* -----------------------------------------
                       EMAIL CONFIRMATION REQUIRED
                    ----------------------------------------- */

                    else {

                        message.className =
                            "success";

                        message.textContent =
                            "Account created. Please check your email to confirm your account.";

                    }

                }
            );

    </script>


</body>

</html>
