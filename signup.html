<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Group Expense Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            to right,
            #000428,
            #041162
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* =====================================================
   SIGN UP CARD
===================================================== */

.signup-container {

    width: 100%;

    max-width: 420px;

    background: #fffdf5;

    padding: 40px;

    border-radius: 18px;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.25);

    animation:
        signup-float 5s ease-in-out infinite;

}


@keyframes signup-float {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-8px);

    }

}


/* =====================================================
   BRAND
===================================================== */

.brand {

    text-align: center;

    margin-bottom: 28px;

}


.brand-icon {

    width: 58px;

    height: 58px;

    margin:
        0 auto 18px;

    display: grid;

    place-items: center;

    background: #f13fbc;

    border-radius: 18px;

    font-size: 27px;

    transform:
        rotate(-5deg);

    box-shadow:
        0 8px 20px
        rgba(4, 17, 98, 0.20);

}


.brand h1 {

    margin: 0;

    color: #0f172a;

    font-size: 25px;

    font-weight: 700;

    letter-spacing:
        -0.4px;

}


.subtitle {

    margin-top: 8px;

    color: #64748b;

    font-size: 14px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 17px;

}


label {

    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-size: 14px;

    font-weight: 600;

}


input {

    width: 100%;

    height: 46px;

    padding:
        0 14px;

    border:
        1px solid #cbd5e1;

    border-radius: 9px;

    background: #f8fafc;

    color: #0f172a;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;

}


input:focus {

    background: #ffffff;

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);

}


input::placeholder {

    color: #94a3b8;

}


/* =====================================================
   CREATE ACCOUNT BUTTON
===================================================== */

button {

    width: 100%;

    height: 48px;

    margin-top: 5px;

    border: none;

    border-radius: 9px;

    background: #2563eb;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.15s,
        opacity 0.15s,
        box-shadow 0.15s;

    box-shadow:
        0 5px 12px
        rgba(37, 99, 235, 0.25);

}


button:hover {

    opacity: 0.94;

    box-shadow:
        0 7px 16px
        rgba(37, 99, 235, 0.30);

}


button:active {

    transform:
        translateY(1px);

}


/* =====================================================
   MESSAGE
===================================================== */

#message {

    min-height: 20px;

    margin-top: 15px;

    text-align: center;

    color: #dc2626;

    font-size: 14px;

    line-height: 1.4;

}


/* =====================================================
   LOGIN LINK
===================================================== */

.login-link {

    margin-top: 22px;

    padding-top: 20px;

    border-top:
        1px solid #e2e8f0;

    text-align: center;

    color: #64748b;

    font-size: 14px;

}


.login-link a {

    color: #2563eb;

    font-weight: 600;

    text-decoration: none;

}


.login-link a:hover {

    text-decoration: underline;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    body {

        padding: 15px;

    }


    .signup-container {

        padding:
            30px 24px;

        border-radius: 15px;

    }


    .brand h1 {

        font-size: 22px;

    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    .signup-container {

        animation: none;

    }

}



    </style>

</head>


<body>


    <div class="signup-container">

        <h1>
            💰 Group Expense Tracker
        </h1>


        <div class="subtitle">

            Create your account

        </div>


        <form id="signupForm">


            <label for="name">

                Name

            </label>


            <input
                id="name"
                type="text"
                required
                autocomplete="name"
            >


            <label for="email">

                Email

            </label>


            <input
                id="email"
                type="email"
                required
                autocomplete="email"
            >


            <label for="password">

                Password

            </label>


            <input
                id="password"
                type="password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <label for="confirmPassword">

                Confirm Password

            </label>


            <input
                id="confirmPassword"
                type="password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <button type="submit">

                Create Account

            </button>


        </form>


        <div id="message"></div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


<script>


const supabaseClient =
    window.supabase.createClient(

        "https://fqsigukfusoplfzvevlz.supabase.co",

        "sb_publishable_S_o8arC97cbzU9F_pUIDOw_7FW-Y_Rz"

    );


document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            const message =
                document
                    .getElementById("message");


            if (
                password !==
                confirmPassword
            ) {

                message.textContent =
                    "Passwords do not match.";

                return;

            }


            message.textContent =
                "Creating account...";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        data: {

                            display_name:
                                name

                        }

                    }

                });


            if (error) {

                console.error(
                    "Signup failed:",
                    error
                );


                message.textContent =
                    error.message;

                return;

            }


            console.log(
                "Account created:",
                data
            );


            /*
                Supabase may require email
                confirmation depending on
                your project settings.
            */

            if (
                data.session
            ) {

                message.textContent =
                    "Account created successfully!";

                setTimeout(
                    function() {

                        window.location.replace(
                            "expensesss.html"
                        );

                    },
                    1000
                );

            }
            else {

                message.textContent =
                    "Account created. Please check your email to confirm your account.";

            }

        }
    );

</script>


</body>

</html>
